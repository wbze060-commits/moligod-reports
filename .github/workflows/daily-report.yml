name: moligod 日报
on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch:
env:
  TZ: Asia/Shanghai
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取全部 68 款子弹数据
        run: python cloud_fetch.py
      - name: 检查国服官方公告（无自动源时明确提示）
        run: python cloud_news.py
        continue-on-error: true
      - name: 生成全子弹日报
        run: python cloud_report_all.py daily "reports/日报_$(date +%F).html"
      - name: 安装 Chrome（PDF 转换）
        uses: browser-actions/setup-chrome@v1
      - name: 转 PDF
        run: |
          chrome --headless --disable-gpu --no-sandbox --print-to-pdf="reports/日报_$(date +%F).pdf" "reports/日报_$(date +%F).html"
      - name: 提交报告到仓库
        run: |
          git config user.name "moligod-bot"
          git config user.email "moligod-bot@users.noreply.github.com"
          git add reports data
          git commit -m "report $(date +%F)" || echo "no changes"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main
            if git push; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: 微信推送（摘要+HTML/PDF 链接）
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
        run: python cloud_push.py daily $(date +%F)
